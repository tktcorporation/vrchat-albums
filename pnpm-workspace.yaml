packages:
  - '.'
  - 'pages'
  - 'packages/*'

# === サプライチェーン攻撃対策 (Shai-Hulud 等) ===
# 公開から一定時間未満のパッケージバージョンの「解決」を拒否する。
# 悪意あるパッケージ（typosquatting / account takeover / 自己増殖ワーム Shai-Hulud 等）は
# 通常公開直後にセキュリティコミュニティが検知・yank するため、この待機期間を設けることで
# 汚染されたバージョンを掴むリスクを大幅に下げられる。
#
# 値は分単位。3 日 = 4320 分。
# frozen-lockfile での install には影響しない（既に解決済みの版をそのまま入れる）。
# 影響するのは `pnpm add` / `pnpm update` 等の新規解決時のみ。
#
# 緊急のセキュリティパッチ等で公開直後の版を即時導入する必要がある場合は、
# 該当パッケージを minimumReleaseAgeExclude に追加する。
minimumReleaseAge: 4320
minimumReleaseAgeExclude: []

# 依存バージョンの解決方針。highest = 範囲内で最も新しいバージョンを選ぶ。
# 既知の脆弱性を含む古いバージョンが解決されるのを防ぐ（画像解像度とは無関係）。
resolutionMode: highest

# === Electron ビルド互換性 ===
# electron-builder は node_modules のフラットな構造を期待するが、pnpm の isolated
# モードではオプショナル依存（プラットフォーム固有のネイティブバインディング）が
# node_modules 直下に配置されない。これによりパッケージング後に
# "Cannot find native binding" エラーが発生する。
# 該当パッケージを publicHoistPattern でホイストすることで解決する。
publicHoistPattern:
  - '@napi-rs/image-*'
  - '@resvg/resvg-js-*'
  - sqlite3
  - clip-filepaths
  - clip-filepaths-*
  - '@vrchat-albums/exif-native'
  - '@vrchat-albums/exif-native-*'

# === ビルドスクリプト実行の許可リスト (pnpm 11: onlyBuiltDependencies → allowBuilds) ===
# pnpm はデフォルトで依存パッケージの install スクリプト（postinstall 等）を実行しない。
# これは Shai-Hulud 等の install スクリプト経由のワーム感染に対する重要な防御層。
# ここに列挙したパッケージだけが install スクリプトの実行を許可される（default-deny）。
# 新たに build を許可する場合は `pnpm approve-builds` で精査してから追加すること。
allowBuilds:
  '@ast-grep/cli': true # lint:ast-grep 用のバイナリをダウンロード
  '@sentry/cli': true # リリース時の sourcemap アップロード用バイナリ
  electron: true # Electron 本体バイナリのダウンロード
  electron-winstaller: true # Windows インストーラ生成
  esbuild: true # プラットフォーム固有バイナリのダウンロード
  simple-git-hooks: true # pre-commit フックのセットアップ
  sqlite3: true # ネイティブモジュールのビルド

# === 依存バージョンの上書き（overrides） ===
# 方針: overrides は最小限に保つ。脆弱性は原則として直接依存のアップグレードで解消し、
# それが不可能な推移的依存に限って override で塞ぐ。override 無しでも同じ版に解決される
# 冗長な指定は置かない（解決方針は resolutionMode: highest に委ねる）。
#
# tar: node-sqlite3（@sequelize/sqlite3 が依存）が古いメジャーの tar をピンしており、
#   その系統には既知の脆弱性がある。引き込み元の sqlite3 / @sequelize/sqlite3 を、
#   patched な tar を引く版へ上げる手段が無いため、override で patched 版へ引き上げて塞ぐ。
#   tar は install/build 時のみ使われ、メジャー跨ぎの強制が動作することは native rebuild で
#   検証している。必要な下限は `pnpm audit` を一次情報として patched 版に追従させること。
#
# override を追加・変更するときは、まず直接依存のアップグレードで解消できないかを検討し、
# できない場合のみ理由を添えてここに記載する。
overrides:
  # GHSA-23hp-3jrh-7fpw (critical): unlimited input decompression DoS。7.5.19 未満が脆弱。
  tar: '>=7.5.19'
  # @tootallnate/once は sqlite3 のネイティブビルド時 (node-gyp > make-fetch-happen >
  # http-proxy-agent) の深い transitive 依存。制御フロー不整合対策として 2.0.1 以上へ固定。
  # 3.x は ESM-only化で http-proxy-agent@4 の require() が壊れるため、CJS 版最終リリースの
  # 2.x 系に明示的に留める。
  '@tootallnate/once': '>=2.0.1 <3'

# === 受容している脆弱性アドバイザリ（pnpm audit の除外） ===
# 修正版が npm に公開されておらず、かつ攻撃面が無いと判断したものだけを置く。
# 各エントリは「なぜ攻撃面が無いか」と「外す条件」を添える。外す条件を満たしたら削除し、
# 必要なら依存を上げて pnpm audit が通ることを確かめる。
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3: 深くネストした brace パターンでスタックを使い切る DoS。
    # @sequelize/core と @tktco/node-actionlint が fast-glob > micromatch 経由で引く。
    # @sequelize/core が fast-glob を使うのは importModels() だけで、アプリはモデルを
    # クラスで直接渡しており（electron/lib/sequelize.ts）呼ばない。node-actionlint は
    # pnpm lint（ローカル・CI）から引数なしで実行され、既定のワークフローパターンだけを
    # glob に渡す。どちらもユーザー入力が glob に届く経路が無い。
    # 外す条件: braces の修正版（3.0.4 以上）が公開され、micromatch の範囲内で解決されること。
    - GHSA-vfj7-8cjw-p6xm
    # sprintf-js <=1.1.3: 精度指定子の上限が無いことによる DoS。
    # electron-builder > @electron/get@3 > global-agent@3 > roarr@2 が引く、ビルド時だけの依存。
    # roarr のフォーマット文字列はライブラリ内部の定数で、外部入力は入らない。
    # 外す条件: sprintf-js の修正版が公開されるか、electron-builder を app-builder-lib が
    # @electron/get@^5（global-agent に依存しない）を引く版（27 系）へ上げること。
    - GHSA-hp3w-g68c-fv3c

# trpc-electron は購読の非同期イテレーターに Symbol.asyncDispose を足し、既にあればエラーにする。
# Electron 44 の Node（24 系）では非同期ジェネレーターが標準で Symbol.asyncDispose を持つため、
# 非同期ジェネレーターで書いた購読はすべて失敗する。既にある場合は標準のもの（return() を呼ぶ）を使うよう変える。
# trpc-electron がこの判定を直した版を出したら、このパッチは外せる。
patchedDependencies:
  trpc-electron@0.1.2: patches/trpc-electron@0.1.2.patch
