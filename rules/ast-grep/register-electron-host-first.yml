id: register-electron-host-first
language: TypeScript
severity: error
message: |
  electron/index.ts の最初の文は `import './registerElectronHost';` にしてください。
note: |
  処理本体（electron/api.ts など）は読み込まれた時点で getHost() を呼ぶので、
  殻の登録はどのモジュールよりも先に評価されなければならない。
  ES モジュールの import は書いた順に評価されるため、最初の文に置くことで順序を保証する。
  参照: .claude/rules/project/electron-import.md
rule:
  kind: program
  not:
    has:
      # コメントは数えず、最初の文を見る
      nthChild:
        position: 1
        ofRule:
          not:
            kind: comment
      kind: import_statement
      has:
        field: source
        regex: ^['"]\./registerElectronHost(\.(ts|js))?['"]$
files:
  - electron/index.ts
