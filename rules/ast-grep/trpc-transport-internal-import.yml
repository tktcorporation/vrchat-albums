id: trpc-transport-internal-import
language: TypeScript
severity: error
message: |
  electron/lib/trpcTransport/ の中身を外から import しないでください。
  main は electron/lib/trpcTransport（index.ts）の startTrpcBroker を、
  処理本体は electron/lib/trpcTransport/backend の serveTrpcOnPort を、
  preload は electron/lib/trpcTransport/preload の exposeTrpcBridge を使ってください。
note: |
  殻（Electron の MessagePort）を換えるときに書き換える範囲を、この 3 つの入口の後ろに閉じ込めるため。
  テストは中身を直接確かめるので対象外。
  構成: electron/lib/trpcTransport/index.ts の JSDoc
rule:
  any:
    - all:
        - any:
            - kind: import_statement
            - kind: export_statement
        - has:
            field: source
            regex: trpcTransport/
        - not:
            has:
              field: source
              regex: trpcTransport/(index|preload|backend)['"]$
    - all:
        - any:
            - pattern: import($PATH)
            - pattern: require($PATH)
        - has:
            stopBy: end
            kind: string
            regex: trpcTransport/
        - not:
            has:
              stopBy: end
              kind: string
              regex: trpcTransport/(index|preload|backend)['"]$
files:
  - '**/*.ts'
ignores:
  - electron/lib/trpcTransport/**
  - '**/*.test.ts'
  - '**/*.spec.ts'
  - '**/__tests__/**'
