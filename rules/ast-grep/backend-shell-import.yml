id: backend-shell-import
language: TypeScript
severity: error
message: |
  処理本体（electron/backend・electron/api.ts・electron/trpc.ts・electron/module）から殻の本体を import しないでください。
  electron-updater・electron/electronUtil.ts・electron/index.ts・electron/lib/sentryMain.ts・
  electron/lib/host/electronHost.ts・electron/lib/host/electronUpdater.ts・electron/lib/backendProcess/supervisor.ts の機能は
  electron/lib/host の getHost()（shell・updater）から受け取ってください。
note: |
  処理本体は utilityProcess で動き、main プロセスにしか無いもの（ウィンドウ・自動更新・
  エラー監視の初期化）は使えない。殻はそれらを Host として実装し、処理本体からの要求で実行する。
  親ディレクトリの index を指す相対パス（'..'、'../index'、'../../index' など）は electron/index.ts に
  届きうるので、処理本体からは使わない。
  参照: .claude/rules/project/electron-import.md
  インターフェース: electron/lib/host/types.ts
utils:
  forbidden-source:
    any:
      - regex: ^['"`]electron-updater(/.*)?['"`]$
      # electron/electronUtil.ts（electron/module/electronUtil/ には index が無く、ディレクトリとしては import しない）
      - regex: (^['"`]|/)electronUtil(\.(ts|js|cjs|mjs))?['"`]$
      # electron/index.ts。親ディレクトリや自ディレクトリの index だけを指す相対パス
      - regex: ^['"`]\.{1,2}(/\.\.)*(/index(\.(ts|js|cjs|mjs))?)?['"`]$
      # 殻を組み立てて登録するモジュール（Electron の API とエラー監視の初期化を持つ）
      - regex: /(sentryMain|electronUpdater|electronHost|supervisor)(\.(ts|js|cjs|mjs))?['"`]$
      # main 用のエラー監視の SDK（Electron の app を前提にする）
      - regex: ^['"`]@sentry/electron/main['"`]$
rule:
  any:
    - all:
        - any:
            - kind: import_statement
            - kind: export_statement
        - has:
            field: source
            matches: forbidden-source
    - all:
        - any:
            - pattern: import($PATH)
            - pattern: require($PATH)
        - has:
            stopBy: end
            any:
              - kind: string
              - kind: template_string
            matches: forbidden-source
files:
  - electron/backend/**/*.ts
  - electron/module/**/*.ts
  - electron/api.ts
  - electron/trpc.ts
ignores:
  - '**/*.test.ts'
  - '**/*.spec.ts'
  - '**/__tests__/**'
