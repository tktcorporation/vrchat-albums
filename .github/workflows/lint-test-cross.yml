name: Lint and Test Cross

on:
  push:

# 同 branch への連続 push では古い run を中断（main は念のため残す）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-node-and-install
        with:
          # lint は napi 実行物を必要としない（types は committed の index.d.ts を使う）。
          # cargo test / napi build を丸ごとスキップして start-up 時間を短縮。
          include-native: 'false'

      - name: lint
        run: pnpm lint

  # packages/exif-native の Rust コードを rustfmt / clippy で検査する。
  # Node の依存は不要なので setup-node-and-install を使わず、Rust toolchain だけを入れる。
  # toolchain は test job と同じく floating stable のため、新しい stable で追加された clippy lint が
  # Rust 側の変更なしに失敗を起こすことがある。その場合は lint に従って修正する。
  rust-lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        # SHA で固定すると ref 名から toolchain を読めないので、stable を明示する
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build (cargo registry / target)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: 'packages/exif-native -> target'

      - name: cargo fmt
        working-directory: packages/exif-native
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: packages/exif-native
        run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: test
        run: pnpm test

  # 写真インデックス作成のヒープ増加を見張るベンチマーク。4K 写真を数百枚生成して数分かかるので、
  # 通常のテストから分けて Linux だけで並行して走らせる
  memory-profile:
    runs-on: ubuntu-22.04
    # テスト側の beforeAll と本体のタイムアウト（各 10 分）より長くし、止まったときに vitest がどの段階かを報告できるようにする
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: memory profile
        run: pnpm test:memory
