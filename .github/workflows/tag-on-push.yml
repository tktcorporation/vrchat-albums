name: Tag on Push to Main

# main の lint とテスト（Lint and Test Cross）が通ったコミットにだけ版タグを付ける。
# 版タグの push が upload-build-files.yml の配布ビルドと公開を起動するので、
# テストが落ちたコミットは配布されない。
on:
  workflow_run:
    workflows: ['Lint and Test Cross']
    types: [completed]
    branches:
      - main
  # 失敗した実行のやり直し用。手動実行では main の先頭コミットに付ける
  workflow_dispatch:

permissions:
  contents: read

# 連続した main への push で同じ版タグを同時に作ろうとして片方が失敗しないよう、1 本ずつ流す
concurrency:
  group: tag-on-push
  cancel-in-progress: false

jobs:
  create_tag:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-22.04

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          # 版タグの push で upload-build-files.yml を起動するため、GITHUB_TOKEN ではなく PAT で push する
          token: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}

      - name: Get current version from package.json
        id: get_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          echo "package_version=$package_version" >> $GITHUB_OUTPUT
          LATEST_RELEASE_TAG=$(gh release list --exclude-drafts --json tagName --limit 1 -t '{{range .}}{{.tagName}}{{end}}')
          echo "latest_release_tag=$LATEST_RELEASE_TAG" >> $GITHUB_OUTPUT

      - name: Check if version differs from latest tag
        id: check_version
        run: |
          tag="v${{ steps.get_version.outputs.package_version }}"
          # 公開前の版タグが既にあれば付け直さない（連続した main への push で同じ版を二重に作らない）
          if [ "$tag" = "${{ steps.get_version.outputs.latest_release_tag }}" ] \
            || git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "new_version=false" >> $GITHUB_OUTPUT
          else
            echo "new_version=true" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Create new version tag if version differs
        if: steps.check_version.outputs.new_version == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag "v${{ steps.get_version.outputs.package_version }}"
          git push origin "v${{ steps.get_version.outputs.package_version }}"
