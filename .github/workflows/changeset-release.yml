name: Changeset Release

on:
  push:
    branches:
      - main

jobs:
  changesets:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-node-and-install
        with:
          # changesets/action は package.json と CHANGELOG を編集するだけ
          include-native: 'false'

      - name: Create Release Pull Request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          pr-title: "chore: release"
          commit-message: "chore: release"
          # リリース PR のコミットを checkout と同じ PAT の git 操作で push し、後続のワークフローを起動させる
          push-with-git-cli: true
          # version-script の実行環境にも GITHUB_TOKEN として渡り、changelog-github が PR とコミットの作者を引くときに使う
          github-token: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}
