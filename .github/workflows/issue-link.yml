name: 'Issue Links'
on:
  pull_request:
    types: [opened]

jobs:
  issue-link:
    runs-on: ubuntu-latest
    # GitHub API を数回叩くだけの action。
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: tkt-actions/add-issue-links@v1.9.2
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          branch-prefix: '/'
          resolve: 'false'
          link-style: 'comment'
